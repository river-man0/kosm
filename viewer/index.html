<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arctic Military Features (OSM)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.3.1/ol.css">
<script src="https://cdn.jsdelivr.net/npm/ol@10.3.1/dist/ol.js"></script>
<style>
  html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
  #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; }

  #panel {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 5;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 6px;
    box-shadow: 0 1px 6px rgba(0, 0, 0, 0.35);
    padding: 12px 14px;
    width: 240px;
    max-height: calc(100% - 24px);
    overflow-y: auto;
  }
  #panel h1 { font-size: 15px; margin: 0 0 4px; }
  #panel .subtitle { font-size: 12px; color: #555; margin: 0 0 10px; }
  #count { font-size: 12px; color: #222; margin-bottom: 10px; }
  #count strong { font-size: 16px; }

  .legend-item { display: flex; align-items: center; font-size: 12px; margin: 3px 0; cursor: pointer; user-select: none; }
  .legend-item input { margin-right: 6px; }
  .swatch { width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.35); }

  #status {
    position: absolute;
    bottom: 8px;
    left: 12px;
    z-index: 5;
    font-size: 11px;
    color: #333;
    background: rgba(255, 255, 255, 0.85);
    padding: 2px 6px;
    border-radius: 4px;
  }

  .ol-popup {
    position: absolute;
    background: white;
    box-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
    border-radius: 6px;
    padding: 10px 12px;
    min-width: 220px;
    max-width: 320px;
    font-size: 12.5px;
    bottom: 14px;
    left: -140px;
  }
  .ol-popup:after {
    content: "";
    position: absolute;
    top: 100%;
    left: 140px;
    border: 7px solid transparent;
    border-top-color: white;
  }
  .ol-popup-closer {
    position: absolute;
    top: 4px;
    right: 8px;
    cursor: pointer;
    font-weight: bold;
    color: #888;
  }
  .ol-popup h2 { font-size: 13.5px; margin: 0 14px 6px 0; }
  .ol-popup table td { vertical-align: top; padding: 1px 0; }
  .ol-popup table td.k { color: #666; padding-right: 8px; white-space: nowrap; }
  .ol-popup a { color: #2166ac; }
</style>
</head>
<body>
<div id="map"></div>

<div id="panel">
  <h1>Arctic Military Features</h1>
  <p class="subtitle">OpenStreetMap features tagged <code>military=*</code> / <code>landuse=military</code>, north of the Arctic Circle (66.5&deg;N).</p>
  <div id="count">Loading&hellip;</div>
  <div id="legend"></div>
</div>

<div id="status"></div>
<div id="popup" class="ol-popup" style="display:none;">
  <span id="popup-closer" class="ol-popup-closer">&times;</span>
  <div id="popup-content"></div>
</div>

<script>
// Category -> color, matched against the "military" tag value first, then
// "landuse". Anything unmatched falls into "other".
const CATEGORIES = [
  { key: "base",        label: "Bases & barracks",  color: "#d73027", tags: ["base", "naval_base", "barracks", "office"] },
  { key: "airfield",     label: "Airfields",          color: "#fc8d59", tags: ["airfield"] },
  { key: "fortification", label: "Bunkers & trenches", color: "#fee08b", tags: ["bunker", "trench", "obstacle_course"] },
  { key: "danger",       label: "Danger areas & ranges", color: "#91cf60", tags: ["danger_area", "range", "training_area", "minefield", "nuclear_explosion_site"] },
  { key: "checkpoint",   label: "Checkpoints",        color: "#4575b4", tags: ["checkpoint"] },
  { key: "other",        label: "Other / unspecified", color: "#999999", tags: [] },
];

function categoryFor(feature) {
  const military = (feature.get("military") || "").toLowerCase();
  for (const cat of CATEGORIES) {
    if (cat.tags.includes(military)) return cat;
  }
  return CATEGORIES[CATEGORIES.length - 1];
}

const styleCache = {};
function styleFor(feature) {
  const cat = categoryFor(feature);
  const geomType = feature.getGeometry().getType();
  const cacheKey = cat.key + ":" + geomType;
  if (styleCache[cacheKey]) return styleCache[cacheKey];

  let style;
  if (geomType === "Point" || geomType === "MultiPoint") {
    style = new ol.style.Style({
      image: new ol.style.Circle({
        radius: 5,
        fill: new ol.style.Fill({ color: cat.color }),
        stroke: new ol.style.Stroke({ color: "#222", width: 1 }),
      }),
    });
  } else if (geomType === "LineString" || geomType === "MultiLineString") {
    style = new ol.style.Style({
      stroke: new ol.style.Stroke({ color: cat.color, width: 3 }),
    });
  } else {
    style = new ol.style.Style({
      stroke: new ol.style.Stroke({ color: cat.color, width: 2 }),
      fill: new ol.style.Fill({ color: cat.color + "55" }),
    });
  }
  styleCache[cacheKey] = style;
  return style;
}

const activeCategories = new Set(CATEGORIES.map((c) => c.key));

const vectorSource = new ol.source.Vector({
  url: "data/arctic_military.geojson",
  format: new ol.format.GeoJSON(),
});

const vectorLayer = new ol.layer.Vector({
  source: vectorSource,
  style: (feature) => {
    const cat = categoryFor(feature);
    return activeCategories.has(cat.key) ? styleFor(feature) : null;
  },
});

const map = new ol.Map({
  target: "map",
  layers: [
    new ol.layer.Tile({ source: new ol.source.OSM() }),
    vectorLayer,
  ],
  view: new ol.View({
    center: ol.proj.fromLonLat([20, 76]),
    zoom: 3,
    minZoom: 2,
    maxZoom: 19,
  }),
});

const statusEl = document.getElementById("status");
vectorSource.on("featuresloaderror", () => {
  statusEl.textContent =
    "Failed to load data/arctic_military.geojson. Run the kosm CLI with --geojson-output to generate it.";
});
vectorSource.once("featuresloadend", () => {
  const features = vectorSource.getFeatures();
  document.getElementById("count").innerHTML =
    "<strong>" + features.length + "</strong> features";
  statusEl.textContent = "";

  if (features.length > 0) {
    map.getView().fit(vectorSource.getExtent(), {
      padding: [40, 40, 40, 260],
      maxZoom: 8,
    });
  }
});
statusEl.textContent = "Loading features…";

// Legend, doubling as a category filter.
const legendEl = document.getElementById("legend");
for (const cat of CATEGORIES) {
  const row = document.createElement("label");
  row.className = "legend-item";

  const checkbox = document.createElement("input");
  checkbox.type = "checkbox";
  checkbox.checked = true;
  checkbox.addEventListener("change", () => {
    if (checkbox.checked) activeCategories.add(cat.key);
    else activeCategories.delete(cat.key);
    vectorLayer.changed();
  });

  const swatch = document.createElement("span");
  swatch.className = "swatch";
  swatch.style.background = cat.color;

  row.appendChild(checkbox);
  row.appendChild(swatch);
  row.appendChild(document.createTextNode(cat.label));
  legendEl.appendChild(row);
}

// Popup on click.
const popupEl = document.getElementById("popup");
const popupContentEl = document.getElementById("popup-content");
const popupOverlay = new ol.Overlay({
  element: popupEl,
  autoPan: { animation: { duration: 200 } },
});
map.addOverlay(popupOverlay);

document.getElementById("popup-closer").addEventListener("click", () => {
  popupEl.style.display = "none";
  return false;
});

const FIELD_LABELS = [
  ["name", "Name"],
  ["military", "Military type"],
  ["landuse", "Landuse"],
  ["operator", "Operator"],
  ["access", "Access"],
  ["start_date", "Start date"],
  ["description", "Description"],
];

map.on("singleclick", (evt) => {
  const feature = map.forEachFeatureAtPixel(evt.pixel, (f) => f);
  if (!feature) {
    popupEl.style.display = "none";
    return;
  }

  const title = feature.get("name") || feature.get("military") || "Military feature";
  let rows = "";
  for (const [key, label] of FIELD_LABELS) {
    const value = feature.get(key);
    if (value) rows += `<tr><td class="k">${label}</td><td>${value}</td></tr>`;
  }
  const osmUrl = feature.get("osm_url");
  if (osmUrl) {
    rows += `<tr><td class="k">OSM</td><td><a href="${osmUrl}" target="_blank" rel="noopener">${osmUrl}</a></td></tr>`;
  }

  popupContentEl.innerHTML = `<h2>${title}</h2><table>${rows}</table>`;
  popupOverlay.setPosition(evt.coordinate);
  popupEl.style.display = "block";
});

map.on("pointermove", (evt) => {
  const hit = map.hasFeatureAtPixel(evt.pixel);
  map.getTarget().style.cursor = hit ? "pointer" : "";
});
</script>
</body>
</html>
